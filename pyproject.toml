[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaxml"
version = "1.2.1"
description = "Extract structured data from multi-gigabyte XML files with bounded memory, as a command line tool and a desktop application."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["xml", "streaming", "etl", "iterparse", "large-files", "cli", "gui", "memory-efficient", "parquet", "csv", "jsonl"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: XML",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
# XSD field-type inference and validation. Optional like every other capability
# that is not CSV: the streaming parser never imports it, and gigaxml works
# without it, so a plain install stays a two-dependency install.
xsd = ["xmlschema>=2.0"]
pretty = ["rich>=13.0"]
# Competitor comparison, used only by benchmarks/compare/. Not a product dependency --
# nobody who installs gigaxml ever needs these; keeping them out of `dev` keeps
# `pip install -e ".[dev,gui]"` free of libraries the product never touches, and the
# comparison suite must stay a pure addition to the tree (installing the package without
# this extra leaves every test green).
bench = [
  "xmltodict>=0.13",
  "pandas>=2.0",
]
# The desktop application. Optional on purpose: the CLI is the product, and Qt is a
# 150-200 MB dependency that only a user of the window needs. Nothing in gigaxml outside
# gigaxml.gui may import it.
#
# pytest-qt belongs here rather than in dev, and that is not tidiness. It refuses to load
# without a Qt binding, and it is loaded as a plugin -- so with it in dev, a plain
# `pip install -e ".[dev]"` gives a pytest that dies before collecting anything:
#   ERROR: pytest-qt requires either PySide6, PyQt5 or PyQt6 installed.
# Keeping it with the binding means `.[dev]` runs the suite and skips the desktop tests,
# while `.[dev,gui]` runs them. Both configurations work, which is the point.
gui = ["PySide6>=6.6", "pytest-qt>=4.4"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "psutil>=5.9",
  "pyarrow>=14.0",
  "rich>=13.0",
  "pyinstaller>=6.10",
  # Drawn by tools/make_icon, which the packaging pipeline runs on every platform. A
  # dependency that only a script's author happened to have installed is a build that only
  # that author's machine can run -- and the icon step is the first thing the pipeline
  # calls, so its absence fails the build before anything is compiled. Build-time only,
  # never a runtime one: nothing in `src/` imports it.
  "pillow>=10.0",
]

[project.scripts]
gigaxml = "gigaxml.cli:main"
gigaxml-gui = "gigaxml.gui.app:main"

[project.urls]
Homepage = "https://github.com/gg320324492-lgtm/GigaXML-Memory-Efficient-XML-Extraction-Toolkit"
Source = "https://github.com/gg320324492-lgtm/GigaXML-Memory-Efficient-XML-Extraction-Toolkit"
Issues = "https://github.com/gg320324492-lgtm/GigaXML-Memory-Efficient-XML-Extraction-Toolkit/issues"
Changelog = "https://github.com/gg320324492-lgtm/GigaXML-Memory-Efficient-XML-Extraction-Toolkit/releases"
Benchmarks = "https://github.com/gg320324492-lgtm/GigaXML-Memory-Efficient-XML-Extraction-Toolkit/blob/main/benchmarks/compare/REPORT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "performance: memory / throughput measurement (excluded from CI, see ROADMAP A11)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `docs/` holds the human-authored spec documents. Ruff >= 0.16 reformats fenced
# Python code blocks inside Markdown, which would rewrite the spec text itself.
# The spec is an input artifact, not source code, so it is excluded from linting.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "ANN", "ARG"]
# RUF001/2/3 exist to catch a lookalike character typed by accident where ASCII was meant.
# The interface's Chinese text in gigaxml/gui/i18n.py uses fullwidth punctuation as
# content -- that is what written Chinese is punctuated with -- so the family is declared
# intentional rather than silenced with a noqa on every line of the table. Anything outside
# this list still trips the rule, which is the part of it worth keeping.
allowed-confusables = ["，", "。", "：", "；", "！", "？", "、", "（", "）"]

[tool.ruff.lint.isort]
known-first-party = ["gigaxml"]

[tool.ruff.format]
quote-style = "double"
