name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The gui extra is installed so the desktop application's tests actually
          # run here. Without it they skip, and a stage whose tests always skip has
          # the appearance of coverage and none of it.
          pip install -e ".[dev,gui]"

      - name: Install Qt's system libraries
        # PySide6's wheel ships the Qt shared objects and the Python bindings, not the
        # system libraries those objects link against. Without these, `import
        # PySide6.QtGui` raises `libEGL.so.1: cannot open shared object file` -- from
        # inside pytest-qt's plugin, during pytest_configure, before a single test runs.
        #
        # The list was derived by reading the ELF NEEDED entries of Qt6Gui, Qt6XcbQpa,
        # Qt6Widgets, Qt6OpenGL and Qt6DBus from the manylinux wheel, not by copying
        # another project's list. NEEDED is what the loader must resolve before it will
        # start; a `lib*.so` string found by searching the file may name a library that
        # is meant to be absent. Four sonames were added to the obvious set on that
        # basis: libX11.so.6, libX11-xcb.so.1, libglib-2.0.so.0 and libxcb-util.so.1.
        #
        # `Install` above being green while this is missing is the misleading part: the
        # package is installed, and what is absent is lower down.
        #
        # One line, deliberately. A trailing backslash is a newline in bash and a literal
        # backslash in PowerShell, so a continued block means two different things
        # depending on which runner executes it -- the failure that bit the packaging
        # pipeline on Windows, where the second line parsed as its own command. This job
        # runs only on ubuntu today, which is exactly the "safe by coincidence" shape that
        # is not a contract: the day a Windows leg joins the matrix, the block must still
        # mean one thing.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb1 libxcb-util1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Lint and format check
        shell: bash
        run: |
          ruff check .
          ruff format --check .

      - name: Unit, integration and security tests
        # The performance tests are excluded: they measure memory and throughput, take
        # minutes, and are not a pass/fail signal (see the performance marker in
        # pyproject.toml). Coverage is measured over the source only.
        # The coarse regression check below is the deliberate exception, and it is
        # loose on purpose -- see that job.
        env:
          # A CI runner has no display. The desktop tests build real widgets
          # and drive the real CLI; only the windowing system is substituted,
          # and this is the same platform the tests are developed against.
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pytest -q --cov=src/gigaxml --cov-report=term-missing --cov-fail-under=95 tests/unit tests/integration

  performance-baseline:
    # The one performance signal in CI, and the loose version of the A11 decision
    # that performance numbers are recorded and never asserted.
    #
    # A11 is not being overturned. The assertion there was "is this as fast as the
    # recording machine", which is red within a week because every runner is a
    # different computer from every other runner and a neighbouring job moves the
    # number. What is asserted here is "is this still within half of where it was",
    # which is the size of regression worth a build failure and the size nobody
    # ships on purpose.
    #
    # Single job, not the interpreter matrix: the quantity is throughput in records
    # per second, and comparing 3.11's number against 3.13's reference would be
    # measuring the interpreter, not the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Performance regression baseline
        # Generates a 10 MB document, extracts it five times, and compares the median
        # throughput and the peak memory against benchmarks/perf-baseline.json. Both
        # counters are self-read inside the child that does the work.
        #
        # If this goes red on a change you believe is harmless, the honest response is
        # to look at the numbers it printed before touching the baseline: a shared
        # runner under load and a real 50% regression look identical from here, and
        # re-recording the baseline is how you tell them apart.
        shell: bash
        run: python benchmarks/perf_baseline.py
