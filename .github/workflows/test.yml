name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no history and, by default, no tags, and three of the
          # benchmark provenance tests ask git questions a depth-1 clone cannot answer:
          # whether the recorded commit exists here, which versions were released, and
          # whether v1.1.0 is an ancestor of that commit. Two of the three fail loudly.
          # The third does not -- it reads "no tags" as "no releases" and passes
          # vacuously, over a completeness check it never performed. A guard that is
          # green because it looked at nothing is worse than one that is red, because
          # the green is the part people read. So the clone is made whole instead.
          # `fetch-depth: 0` is the whole of the fix: every commit and every tag.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The gui extra is installed so the desktop application's tests actually
          # run here. Without it they skip, and a stage whose tests always skip has
          # the appearance of coverage and none of it.
          #
          # The xsd extra is installed for the same reason, and the important part is
          # what it does NOT change: the tests that prove the core works without any
          # optional dependency hide the module in sys.modules themselves, so they
          # still test a machine that has never heard of xmlschema. Installing it here
          # means the schema code is exercised rather than skipped -- the first CI run
          # of it left gigaxml/xsd.py at 0% and the coverage gate failed, because a
          # suite that skips the code it just added has measured nothing about it.
          pip install -e ".[dev,gui,xsd]"

      - name: Install Qt's system libraries
        # PySide6's wheel ships the Qt shared objects and the Python bindings, not the
        # system libraries those objects link against. Without these, `import
        # PySide6.QtGui` raises `libEGL.so.1: cannot open shared object file` -- from
        # inside pytest-qt's plugin, during pytest_configure, before a single test runs.
        #
        # The list was derived by reading the ELF NEEDED entries of Qt6Gui, Qt6XcbQpa,
        # Qt6Widgets, Qt6OpenGL and Qt6DBus from the manylinux wheel, not by copying
        # another project's list. NEEDED is what the loader must resolve before it will
        # start; a `lib*.so` string found by searching the file may name a library that
        # is meant to be absent. Four sonames were added to the obvious set on that
        # basis: libX11.so.6, libX11-xcb.so.1, libglib-2.0.so.0 and libxcb-util.so.1.
        #
        # `Install` above being green while this is missing is the misleading part: the
        # package is installed, and what is absent is lower down.
        #
        # One line, deliberately. A trailing backslash is a newline in bash and a literal
        # backslash in PowerShell, so a continued block means two different things
        # depending on which runner executes it -- the failure that bit the packaging
        # pipeline on Windows, where the second line parsed as its own command. This job
        # runs only on ubuntu today, which is exactly the "safe by coincidence" shape that
        # is not a contract: the day a Windows leg joins the matrix, the block must still
        # mean one thing.
        #
        # ★ M14: the day has come, and the resolution is that this step is *genuinely*
        # Linux-only rather than merely Linux-only so far. `apt-get` names a package
        # manager; there is no Windows or macOS step that could perform the same install,
        # because on those platforms PySide6's wheel carries the Qt shared objects and the
        # platform plugins (verified locally: `qoffscreen.dll` and `qwindows.dll` sit in
        # the Windows wheel's plugins/platforms). So the condition below is not a way of
        # making a failure go away -- it is the step's precondition, stated. The same
        # `if: runner.os == 'Linux'` shape is already used by package.yml for its own
        # manylinux build, so this is the repository's precedent rather than a new idea.
        #
        # And `tools/ci_selfcheck.py shape` refuses any `if:` on a step that runs tests,
        # which is what keeps this from becoming the general escape hatch: a condition is
        # allowed where the thing being done is platform-specific, and forbidden where it
        # could hide a platform-specific test result.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb1 libxcb-util1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Lint and format check
        shell: bash
        run: |
          ruff check .
          ruff format --check .

      - name: Prove this runner is the platform this job claims
        # ★ M14 criterion B. A matrix row is a claim. This reads the job's `runs-on` out
        # of this file and fails unless the interpreter answering it is that platform, so
        # a leg pointed at the wrong image says so here instead of reporting green while
        # testing something else. It also prints the three machine facts the junit report
        # cannot see -- whether the filesystem folds case, whether symlinks and hard links
        # can be created, which Qt platform plugins the wheel shipped -- because on a
        # runner those are the things that decide whether a platform-specific test can run
        # at all, and they are not the same as on the machine that wrote the test.
        shell: bash
        run: python tools/ci_selfcheck.py platform --job test

      - name: Unit, integration and security tests
        # The performance tests are excluded: they measure memory and throughput, take
        # minutes, and are not a pass/fail signal (see the performance marker in
        # pyproject.toml). Coverage is measured over the source only.
        # The coarse regression check below is the deliberate exception, and it is
        # loose on purpose -- see that job.
        #
        # The directories are listed rather than left to pyproject's testpaths, which
        # only applies to a pytest with no paths given. This command names its paths,
        # so a suite that is not written here does not run -- and a suite that does
        # not run is worse than none: "the CI is green" would still be typed while
        # nothing in it watched the new code. tests/golden holds the command line's
        # frozen behaviour, tests/security the schema boundary; both arrived after
        # this list was written and both had to be added to it. tests/property is the
        # third: it arrived in M12 and is the only suite that generates its own inputs,
        # so the directory being absent would leave the parsers checked by hand-written
        # cases alone and nothing would say so.
        #
        # ★ M14 adds `--junit-xml` and nothing else to the command itself. The exit code
        # was already the gate; what the file adds is the number, which no exit code
        # carries, and which is the only way to tell "the suite ran" from "the suite
        # quietly stopped running something".
        env:
          # A CI runner has no display. The desktop tests build real widgets
          # and drive the real CLI; only the windowing system is substituted,
          # and this is the same platform the tests are developed against.
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pytest -q --cov=src/gigaxml --cov-report=term-missing --cov-fail-under=95 --junit-xml=ci-report.xml tests/unit tests/integration tests/golden tests/security tests/property

      - name: Check the run was real
        # ★ M14 criterion B, and the reason it is a separate step with `always()`: a
        # report that only prints when the tests passed diagnoses nothing. The floors
        # here are measured, not chosen for comfort -- 2004 test cases on this
        # repository's Windows checkout as of 2026-10-02, 0 skipped, so 1700 leaves about
        # 15% of headroom and a ceiling of 0 skips on that platform is a real claim: the
        # whole suite runs there, including the sixteen platform guards that skip
        # themselves on this one.
        #
        # 40 is the ceiling for this platform and it is the one number here that is NOT
        # measured: of the 18 skips this platform recorded on 2026-10-02, seven are
        # `TerminateProcess is a Windows call` (test_gui_history.py, test_gui_results.py
        # and test_gui_resume.py), six are `exclusive file locking is a Windows behaviour`
        # (test_gui_errors.py, test_gui_results.py), two are `only Windows refuses
        # os.replace while the target is open` (test_atomic_output.py) and one is the
        # case-folding check in test_filesystem_paths.py. It is
        # deliberately loose -- it exists to catch a suite that stopped running, not to
        # police individual skips -- and this run of CI prints the exact count and every
        # reason, which is what turns the estimate into a measurement.
        if: always()
        shell: bash
        run: python tools/ci_selfcheck.py report ci-report.xml --min-tests 1700 --max-skips 40

  # ★ M14: the platform legs. Three facts decided what is in them, and each was measured
  # rather than assumed (docs/STAGE3-M14-REPORT.md).
  #
  # 1. They run the *whole* suite, the same five directories as ubuntu, with no `--ignore`
  #    and no marker. A narrower "core" was considered and rejected: `tools/ci_selfcheck.py
  #    shape` forbids `--ignore` in any pytest command precisely because a selection that
  #    quietly narrows is the one failure mode nobody downstream can detect, and a
  #    hand-maintained list of 30 file paths is that failure waiting to happen.
  # 2. They run one Python version (3.13), not three. The interpreter axis is already
  #    covered by the ubuntu matrix; what these legs add is the platform axis, and
  #    multiplying the two axes means every red is ambiguous between "wrong interpreter"
  #    and "wrong platform" -- and macOS runners are expensive enough that paying for the
  #    ambiguity twice is a poor trade.
  # 3. They carry no coverage gate. Coverage is a whole-tree claim and exactly one job may
  #    assert it (also enforced by `shape`); the per-platform line counts differ anyway,
  #    because `# pragma: no cover - Windows only` and run.py's three-branch peak-memory
  #    reader mean each platform executes a different set of lines.
  #
  # ★ macOS is `macos-15`, not `macos-latest`, for the reason package.yml records at its
  # own matrix: `macos-13` sat in a matrix for nine months past its retirement and a
  # retired label queues forever with no error message. `macos-15` is the arm64 image the
  # packaging job already builds on, so the test leg and the shipped binary run on the
  # same Mac architecture.
  test-windows:
    name: test (windows-latest, 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole clone: history and tags. The first checkout in this file says why.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # ★ No Qt system-library step, and the absence is the point rather than an
        # oversight: `apt-get` names a Linux package manager, and on Windows there is
        # nothing to install. PySide6's win_amd64 wheel carries the Qt DLLs and the
        # platform plugins -- confirmed locally, where `plugins/platforms/` holds both
        # `qwindows.dll` and `qoffscreen.dll`, and confirmed with pip's own resolver,
        # which selects `pyside6-6.11.2-cp310-abi3-win_amd64.whl` for CPython 3.13.
        # The probe step below asserts the offscreen plugin is present, so if a future
        # PySide6 changes the layout this goes red here instead of turning every GUI test
        # into a collection error.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,xsd]"

      - name: Lint and format check
        shell: bash
        run: |
          ruff check .
          ruff format --check .

      - name: Prove this runner is the platform this job claims
        shell: bash
        run: python tools/ci_selfcheck.py platform --job test-windows

      - name: Unit, integration and security tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pytest -q --junit-xml=ci-report.xml tests/unit tests/integration tests/golden tests/security tests/property

      - name: Check the run was real
        # ★ `--max-skips 0`, which is the strongest claim in this file and the reason this
        # leg is worth its minutes. On a Windows checkout the entire suite runs: 2004 cases
        # as of 2026-10-02, none skipped. That includes the Windows-only bodies (the two
        # exclusive-handle locks, TerminateProcess, the filesystem tests needing a symlink,
        # a hard link and case folding) and the 150-file FHIR schema set in
        # examples/fhir/xsd/ -- every one of which skips or is impossible on the linux leg.
        # A ceiling of zero means a
        # runner that cannot do one of those things fails loudly, with the probe above
        # naming the missing capability, rather than reporting green over a suite that
        # quietly stopped testing the platform it exists for.
        #
        # ★ This ceiling was unreachable until 2026-10-03, and the reason is worth keeping:
        # the two FHIR tests skipped because the schema set lived in gitignored `data/`, so
        # the strongest claim in this file was contradicted by the repository's own layout
        # rather than by any runner's capability. Committing the set is what made the claim
        # true; raising the ceiling would have hidden it.
        if: always()
        shell: bash
        run: python tools/ci_selfcheck.py report ci-report.xml --min-tests 1700 --max-skips 0

  test-macos:
    name: test (macos-15, 3.13)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole clone: history and tags. The first checkout in this file says why.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # Same reasoning as the Windows leg: there is no Homebrew package to install,
        # because PySide6's macOS wheel is `macosx_12_0_universal2` and carries the
        # plugins. The resolver's answer is the evidence, and it also bounds the platform:
        # pip has no PySide6 6.6+ wheel below macOS 12, so `macos-11` could never have
        # installed the gui extra. `macos-15` is above that floor by three releases.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,xsd]"

      - name: Lint and format check
        shell: bash
        run: |
          ruff check .
          ruff format --check .

      - name: Prove this runner is the platform this job claims
        shell: bash
        run: python tools/ci_selfcheck.py platform --job test-macos

      - name: Unit, integration and security tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          pytest -q --junit-xml=ci-report.xml tests/unit tests/integration tests/golden tests/security tests/property

      - name: Check the run was real
        # ★ The same 1700 floor, and a skip ceiling of 40 for the same reason as ubuntu:
        # this platform skips the Windows-only arms by design. What this leg adds is not
        # coverage of *different* branches -- an AST sweep of the whole test tree found 12
        # `sys.platform` branches, and macOS takes the same arm as linux for all 12 -- but
        # the guarantee that none of them differs on Apple's filesystem, which is
        # case-insensitive by default, has no `/proc`, and puts `TMPDIR` behind the
        # `/var` -> `/private/var` symlink. That is the half of the platform axis that
        # ubuntu cannot speak for.
        if: always()
        shell: bash
        run: python tools/ci_selfcheck.py report ci-report.xml --min-tests 1700 --max-skips 40

  ci-shape:
    # ★ M14 criterion B, static half. It needs no runner, so it runs on the one platform
    # that is cheap, and it checks the *file* rather than this run: every job's matrix
    # expansion, no `continue-on-error`, no `if:` on a step that runs tests, no `--ignore`
    # in a pytest command, one shared list of test directories, exactly one coverage gate,
    # and `performance-baseline` still a single ubuntu job.
    #
    # The point of putting it in CI rather than only in a reviewer's head is that the
    # properties are about edits nobody thinks are test edits. Renaming a job does not feel
    # like changing what is checked, and it is.
    name: the workflow's own claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole clone: history and tags. The first checkout in this file says why.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # `.[dev]` only: this job reads YAML and asserts facts about it. It needs no Qt,
        # no lxml, and nothing gigaxml imports -- a check that installs the product to
        # read a config file is a check with more ways to fail than it has claims.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyyaml

      - name: Print the expanded job list
        shell: bash
        run: python tools/ci_selfcheck.py shape --verbose

      # ★ A comment that grew into an essay costs nothing to write and is
      # never paid for. This job is where that belongs: `check_comments.py` reads
      # src/ with `tokenize` and `ast` and imports nothing outside the standard
      # library, so -- like the steps above it -- it needs no Qt, no lxml and no
      # gigaxml. A guard no job runs is a sentence in a file, which is the failure
      # mode the comment milestone was raised to end.
      - name: Comments in src/ stay within their limits
        shell: bash
        run: python tools/check_comments.py

      # ★ The packaging job runs only on a tag, so a build input that does not parse was
      # invisible to every pull request in between. On the first tag this repository ever
      # built, all three platforms failed with "ValueError: invalid literal for int()
      # with base 10: '0rc1'", raised while PyInstaller was *reading*
      # packaging/gigaxml.spec -- and the whole test suite was green, because nothing in
      # it ever executed the spec. A version bump is an ordinary pull request here; only
      # the artifact build was ever able to notice one.
      #
      # This executes the spec without building anything: PyInstaller is stubbed and its
      # four build calls are recorders, so what runs is the spec's own Python -- its
      # imports, its path arithmetic, and the reduction from a version to the four
      # integers a Windows version number is made of. It reads the version
      # pyproject.toml declares and then the same reduction against a fixed set of
      # pre-release shapes, so the next bump to 3.0.0rc2 goes red here rather than at a
      # tag. The shapes are fixed rather than taken from pyproject.toml on purpose: a
      # check that only exercises today's version stops covering the case it exists for
      # the day today's version stops being a pre-release.
      #
      # It installs nothing. This job already has the package with --no-deps, and
      # tools/spec_check.py imports nothing outside the standard library -- the point of
      # stubbing PyInstaller is that neither the check nor a laptop without it has to
      # have it.
      - name: The PyInstaller spec parses and reduces the version
        shell: bash
        run: python -m tools.spec_check

      # ★ M19. `docs/` is gitignored on purpose -- the comment in .gitignore says the
      # friction of `git add -f` is the point -- and three milestone reports were added
      # with exactly that command, so anyone opening the repository could read the
      # project's internal process vocabulary. A convention nothing checks is a
      # convention that has already failed once.
      #
      # It reads the index and .gitignore with git itself, so it needs nothing installed,
      # and it is here rather than in a test because what it checks is the repository's
      # own shape rather than any behaviour of the code.
      - name: Nothing tracked is excluded by .gitignore
        shell: bash
        run: python tools/ci_selfcheck.py tracked

      # ★ M15 criterion C/D. Two third-party actions on the release chain hold the rights
      # to publish -- one attaches files to a Release, the other uploads to PyPI where a
      # name cannot be reused -- and both were referenced by refs that move: a tag, and a
      # *branch*, which is worse because it can be force-pushed with no release to account
      # for. They are now pinned to commit SHAs.
      #
      # This step is the guard for that, and it is split from the one below on purpose. The
      # structural check needs no network and cannot be argued with; the resolution check
      # asks each remote whether the version comment is true, and if github.com is
      # unreachable it says the check could not run and exits 2. Keeping them apart means a
      # network blip cannot be mistaken for a workflow defect, which is the failure mode a
      # combined check would have.
      - name: Third-party actions are pinned to commit SHAs
        shell: bash
        run: python tools/ci_selfcheck.py pins

      - name: ...and each pin really is the release it claims
        shell: bash
        run: python tools/ci_selfcheck.py pins --verify-remote

  # ★ M15 criterion B. Two runtime dependencies, scanned for known vulnerabilities.
  #
  # ★ What a red here does and does not mean. It fails this workflow, so the pull request
  # is marked failing and somebody is told. It does *not* block a release: package.yml has
  # no `needs:` on this job and never will, because a release has to be possible on a day
  # the advisory database is unreachable or the scanner has an outage. Criterion B asks for
  # "know", not "stop", and the distinction is carried by which workflow the job lives in
  # rather than by a flag in this one -- a flag would be a thing somebody could later
  # change without noticing they had changed what a red means.
  #
  # The scanned set is a real plain `pip install .` in its own environment, not a
  # requirements file written by hand. A hand-written list is correct until somebody adds a
  # dependency, and then it is quietly short of one -- and the dependency nobody scanned is
  # the one that has the advisory. Same shape as the release globs reading themselves out
  # of the workflow.
  #
  # pip-audit is installed here rather than added to pyproject's `dev` extra: nothing in
  # the repository imports it, nothing a contributor needs to run it locally, and adding it
  # would put a version floor in the tree that M6 already went round once. The cost is that
  # `pip install -e ".[dev]"` does not bring it -- paid knowingly, and this comment is where
  # the bill is recorded.
  dependency-audit:
    name: runtime dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole clone: history and tags. The first checkout in this file says why.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit the runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          # No extras. This is the set a CLI user gets from `pip install gigaxml`, which
          # is the smallest thing worth auditing: the optional extras are the developer's
          # choice and are covered by the same advisories as what they pull.
          python -m venv "$RUNNER_TEMP/auditenv"
          "$RUNNER_TEMP/auditenv/bin/python" -m pip install --quiet .
          # gigaxml is filtered out, and the filter is not tidying: `pip-audit
          # --requirement` resolves what it is given by installing it, so listing the
          # package made the job audit gigaxml by downloading it from PyPI. That works
          # only for a version already published -- ahead of a release the install failed
          # and the job went red with "No matching distribution found", which reads like
          # a security finding and is not one. Measured: the same file with the published
          # 1.2.1 audits clean; with the unpublished version it cannot install at all; with
          # gigaxml dropped, the dependencies audit clean from the same tree.
          "$RUNNER_TEMP/auditenv/bin/python" -m pip list --format=freeze \
            | grep -viE '^(pip|gigaxml)==' > "$RUNNER_TEMP/runtime.txt"
          echo "--- the exact set being audited"
          cat "$RUNNER_TEMP/runtime.txt"
          # Every finding is printed, one per line, with its fix versions. That is not a
          # formatting preference: "the scan passed" is a claim about a run somebody has to
          # be able to check, and it is worth nothing next to the four rows it replaces.
          # The exit code is non-zero on a finding, which is the only reason anyone looks.
          pip-audit --requirement "$RUNNER_TEMP/runtime.txt" --progress-spinner off

  performance-baseline:
    # The one performance signal in CI, and the loose version of the A11 decision
    # that performance numbers are recorded and never asserted.
    #
    # A11 is not being overturned. The assertion there was "is this as fast as the
    # recording machine", which is red within a week because every runner is a
    # different computer from every other runner and a neighbouring job moves the
    # number. What is asserted here is "is this still within half of where it was",
    # which is the size of regression worth a build failure and the size nobody
    # ships on purpose.
    #
    # Single job, not the interpreter matrix: the quantity is throughput in records
    # per second, and comparing 3.11's number against 3.13's reference would be
    # measuring the interpreter, not the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole clone: history and tags. The first checkout in this file says why.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Performance regression baseline
        # Generates a 10 MB document, extracts it five times, and compares the median
        # throughput and the peak memory against benchmarks/perf-baseline.json. Both
        # counters are self-read inside the child that does the work.
        #
        # If this goes red on a change you believe is harmless, the honest response is
        # to look at the numbers it printed before touching the baseline. The throughput
        # floor is 60% of the recorded reference -- a drop of more than 40% -- and a
        # shared runner under load looks exactly like a regression of that size from
        # here, so re-recording the baseline is how you tell the two apart.
        shell: bash
        run: python benchmarks/perf_baseline.py
