name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Unit, integration and security tests
        # The performance tests are excluded: they measure memory and throughput, take
        # minutes, and are not a pass/fail signal (see the performance marker in
        # pyproject.toml). Coverage is measured over the source only.
        run: |
          pytest -q \
            --cov=src/gigaxml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            tests/unit tests/integration
